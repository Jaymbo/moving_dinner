name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Lint, Test, Build)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movingdinner
          POSTGRES_PASSWORD: movingdinner
          POSTGRES_DB: movingdinner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Lint
        working-directory: ./backend
        run: npm run lint
      
      - name: Run Prisma migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://movingdinner:movingdinner@localhost:5432/movingdinner_test
        run: |
          npx prisma migrate dev --name init
          npx prisma generate
      
      - name: Test
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://movingdinner:movingdinner@localhost:5432/movingdinner_test
          JWT_SECRET: test-secret-min-32-characters-long-for-ci
          NODE_ENV: test
        run: npm run test
      
      - name: Build
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://movingdinner:movingdinner@localhost:5432/movingdinner_test
          JWT_SECRET: test-secret-min-32-characters-long-for-ci
        run: npm run build

  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      
      - name: Test
        working-directory: ./frontend
        run: npm run test
      
      - name: Build
        working-directory: ./frontend
        run: npm run build

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Compose (dry run)
        run: |
          docker compose config
        env:
          DOCKER_COMPOSE_FILE: docker-compose.yml
