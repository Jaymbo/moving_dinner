services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: movingdinner
      POSTGRES_PASSWORD: movingdinner
      POSTGRES_DB: movingdinner
    ports:
      - '5432:5432'
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U movingdinner']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3002:3001'
    environment:
      DATABASE_URL: postgresql://movingdinner:movingdinner@db:5432/movingdinner?schema=public
      PORT: '3001'
      JWT_SECRET: change-me-in-production
      SMTP_HOST: smtp.example.com
      SMTP_PORT: '587'
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: 'Moving Dinner <noreply@example.com>'
      BASE_URL: http://localhost:3003
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3003:80'
    depends_on:
      - backend

volumes: {}