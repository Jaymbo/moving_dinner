<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body{font-family:Arial,Helvetica,sans-serif;margin:12px}
      button{padding:8px 12px;font-size:14px}
      #status{margin-top:12px;color:#333}
    </style>
  </head>
  <body>
    <h3>Neues Treffen</h3>
    <p>Wähle Datum und Deadline für das Treffen (Standard-Deadline = 3 Tage vor dem Datum).</p>
    <label>Datum: <input type="date" id="meetingDate"></label><br><br>
    <label>Deadline: <input type="date" id="deadlineDate"></label><br><br>
    <button id="createBtn">Formular erstellen</button>
    <div id="status"></div>
    <p>Neu hier? <a href="https://docs.google.com/forms/d/e/1FAIpQLScNpXyNBuKS-zx_LsjXQoBlJT6sMJ5PY-I1qvb3kxsJsqQzUA/viewform?usp=dialog" target="_blank">Hier registrieren</a></p>
    <hr>
    <h4>Offene Treffen</h4>
    <div id="openList">Lade...</div>

    <script>
      const btn = document.getElementById('createBtn');
      const status = document.getElementById('status');
      const dateInput = document.getElementById('meetingDate');
      const deadlineInput = document.getElementById('deadlineDate');

      // When meeting date changes, default deadline = date - 3 days
      dateInput.addEventListener('change', () => {
        const d = dateInput.value; // yyyy-mm-dd
        if (!d) return;
        const dt = new Date(d);
        dt.setDate(dt.getDate() - 3);
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const day = String(dt.getDate()).padStart(2, '0');
        deadlineInput.value = y + '-' + m + '-' + day;
      });

      btn.addEventListener('click', () => {
        const dateVal = dateInput.value;
        const deadlineVal = deadlineInput.value;
        if (!dateVal) { status.textContent = 'Bitte Datum wählen.'; return; }
        status.textContent = 'Erstelle Formular...';
        btn.disabled = true;
        google.script.run
          .withSuccessHandler(function(result) {
            if (result && result.editUrl) {
                status.innerHTML = 'Formular erstellt. <a href="' + result.editUrl + '" target="_blank">Formular bearbeiten</a>';
              } else {
                status.textContent = 'Formular erfolgreich erstellt und verknüpft.';
              }
              // refresh open meetings list
              if (typeof loadOpenList === 'function') loadOpenList();
              btn.disabled = false;
          })
          .withFailureHandler(function(err) {
            status.textContent = 'Fehler: ' + (err && err.message ? err.message : JSON.stringify(err));
            btn.disabled = false;
          })
          .createAndLinkFormFromUI(dateVal, deadlineVal);
      });

      // Load open meetings on start
      function loadOpenList() {
        const list = document.getElementById('openList');
        list.textContent = 'Lade...';
        google.script.run.withSuccessHandler(function(items){
          if (!items || items.length === 0) { list.textContent = 'Keine offenen Treffen.'; return; }
          const ul = document.createElement('ul');
          items.forEach(it => {
            const li = document.createElement('li');
            if (it.publishedUrl) {
              const a = document.createElement('a');
              a.href = it.publishedUrl;
              a.target = '_blank';
              a.textContent = (it.sheetName || it.dateIso) + ' (' + (it.dateDisplay || it.dateIso) + ')';
              li.appendChild(a);
            } else {
              li.textContent = (it.sheetName || it.dateIso) + ' (' + (it.dateDisplay || it.dateIso) + ') - kein Formular-Link verfügbar';
            }
            ul.appendChild(li);
          });
          list.innerHTML = '';
          list.appendChild(ul);
        }).getOpenMeetingForms();
      }

      loadOpenList();
    </script>
  </body>
</html>
